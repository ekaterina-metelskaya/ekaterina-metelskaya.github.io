<!-- Баннер согласия на аналитику. Показывает js/consent.js, пока посетитель не выбрал; {{root}} — путь к корню сайта -->
<section class="consent" data-consent hidden aria-labelledby="consent-title">
  <div class="consent-text">
    <h2 class="t-title" id="consent-title">Немного аналитики?</h2>
    <p class="t-body">Хочу понимать, какие страницы вам интересны, и делать сайт лучше. Для этого использую Google Analytics. <a href="{{root}}privacy.html">Политика конфиденциальности</a></p>
  </div>
  <div class="consent-actions">
    <button type="button" class="btn btn--outline" data-consent-choice="denied">Отклонить</button>
    <button type="button" class="btn btn--outline" data-consent-choice="granted">Разрешить</button>
  </div>
</section>
<script src="{{root}}js/consent.js"></script>
